<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ずっと一緒。よくある質問・お問い合わせ</title>
<meta name="description" content="連れ歩きギミック「ずっと一緒。」のよくある質問と、お問い合わせ方法です。キプフェル・まめひなた／ネコチヤンから選べます。">
<meta property="og:type" content="website">
<meta property="og:title" content="ずっと一緒。よくある質問・お問い合わせ">
<meta property="og:description" content="連れ歩きギミック「ずっと一緒。」のよくある質問と、お問い合わせ方法です。キプフェル・まめひなた／ネコチヤンから選べます。">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDGothic&display=swap">
<style>
/* Layout: 1 列の読み物（最大 46rem）。見出し → 確認リスト → キーワードで絞れる質問（分類ごと）→ 問い合わせカード → フッター */
:root {
  color-scheme: light;
  --bg: #F2F6F1;
  --surface: #FFFFFF;
  --ink: #1C2620;
  --muted: #5A6960;
  --line: #D6E1D8;
  --accent: #2C7653;
  --accent-ink: #FFFFFF;
  --accent-soft: #E0EEE5;
  --note: #855510;
  --note-soft: #FBF0DC;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", sans-serif;
  --font-body: "BIZ UDPGothic", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
  --font-mono: "BIZ UDGothic", "Osaka-Mono", "MS Gothic", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101612; --surface: #172019; --ink: #E3ECE5; --muted: #9AA9A0; --line: #28342C;
    --accent: #6AC398; --accent-ink: #0D1912; --accent-soft: #1C2B23; --note: #E6B66A; --note-soft: #2A2216;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101612; --surface: #172019; --ink: #E3ECE5; --muted: #9AA9A0; --line: #28342C;
  --accent: #6AC398; --accent-ink: #0D1912; --accent-soft: #1C2B23; --note: #E6B66A; --note-soft: #2A2216;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.8;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 56px;
}
.wrap { max-width: 46rem; margin: 0 auto; display: flex; flex-direction: column; gap: 56px; }
a { color: var(--accent); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible, summary:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px;
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.4; }
h2 { font-size: 1.45rem; font-weight: 700; }
h3 { font-size: 0.95rem; font-weight: 700; color: var(--muted); letter-spacing: 0.06em; }
p { margin: 0; }

/* ---- 見出し ---- */
.hero { display: flex; flex-direction: column; gap: 14px; }
h1 { font-size: clamp(2rem, 7vw, 2.8rem); font-weight: 700; }
h1 .sub { display: block; font-size: 0.5em; font-weight: 500; color: var(--muted); margin-top: 4px; }
.steps { display: flex; gap: 10px; align-items: center; height: 22px; }
.steps i { display: block; width: 9px; height: 13px; border-radius: 50%; background: var(--accent); }
.steps i:nth-child(odd) { transform: translateY(-4px) rotate(-12deg); }
.steps i:nth-child(even) { transform: translateY(4px) rotate(12deg); }
.steps i:nth-child(1) { opacity: .18; } .steps i:nth-child(2) { opacity: .28; } .steps i:nth-child(3) { opacity: .4; }
.steps i:nth-child(4) { opacity: .55; } .steps i:nth-child(5) { opacity: .7; } .steps i:nth-child(6) { opacity: .85; }
.lead { max-width: 38rem; }
.jump { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.jump a {
  text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  padding: 6px 14px; border-radius: 999px; font-size: 0.9rem;
}
.jump a:hover { border-color: var(--accent); color: var(--accent); }

/* ---- メニューの場所（Unity のメニュー表記） ---- */
.path {
  font-family: var(--font-mono); font-size: 0.85em; white-space: nowrap;
  background: var(--accent-soft); color: var(--ink); padding: 1px 8px; border-radius: 6px;
}
.path .sep { color: var(--accent); margin: 0 0.25em; }
.ui { font-weight: 700; }

/* ---- 確認リスト ---- */
.section { display: flex; flex-direction: column; gap: 16px; }
.section > p { color: var(--muted); }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.checks label { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; cursor: pointer; }
.checks input { width: 20px; height: 20px; margin: 4px 0 0; accent-color: var(--accent); flex: 0 0 auto; }
.checks input:checked + span { color: var(--muted); }

/* ---- よくある質問 ---- */
.search { display: flex; flex-direction: column; gap: 6px; }
.search label { font-size: 0.85rem; color: var(--muted); }
.search input {
  width: 100%; font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px;
}
.search input::placeholder { color: var(--muted); opacity: .8; }
.cats { display: flex; flex-direction: column; gap: 32px; }
.cat { display: flex; flex-direction: column; gap: 8px; }
.qa { border-top: 1px solid var(--line); }
.qa:last-child { border-bottom: 1px solid var(--line); }
summary {
  list-style: none; cursor: pointer; display: flex; gap: 12px; align-items: flex-start;
  padding: 14px 0; font-weight: 700;
}
summary::-webkit-details-marker { display: none; }
summary .q { font-family: var(--font-display); color: var(--accent); flex: 0 0 auto; line-height: 1.8; }
summary .t { flex: 1 1 auto; min-width: 0; }
summary::after {
  content: "+"; flex: 0 0 auto; font-family: var(--font-display); color: var(--muted);
  width: 1.2em; text-align: center; line-height: 1.8;
}
details[open] > summary::after { content: "−"; }
.a { padding: 0 0 18px 1.75em; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.nohit { background: var(--note-soft); color: var(--ink); border-radius: 12px; padding: 12px 16px; }

/* ---- お問い合わせ ---- */
.contact {
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
  padding: 28px clamp(18px, 4vw, 32px); display: flex; flex-direction: column; gap: 20px;
}
.flow { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 6px; }
.flow li::marker { font-family: var(--font-display); color: var(--accent); font-weight: 700; }
.shop {
  align-self: flex-start; display: inline-flex; gap: 8px; align-items: center; text-decoration: none;
  background: var(--accent); color: var(--accent-ink); padding: 10px 18px; border-radius: 999px; font-weight: 700;
}
.shop:hover { filter: brightness(1.06); }
.tpl { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; min-width: 0; }
.tpl-head {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 14px; background: var(--accent-soft); font-size: 0.9rem; font-weight: 700;
}
.tpl-head button {
  font: inherit; font-weight: 700; cursor: pointer; color: var(--accent-ink); background: var(--accent);
  border: 0; border-radius: 999px; padding: 6px 16px;
}
.tpl pre {
  margin: 0; padding: 14px 16px; font-family: var(--font-mono); font-size: 0.88rem; line-height: 1.9;
  white-space: pre-wrap; word-break: break-word; overflow-x: auto; color: var(--ink); background: var(--surface);
}
.notes { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 0.92rem; }
.notes strong { color: var(--ink); }

footer { color: var(--muted); font-size: 0.85rem; display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--line); padding-top: 20px; }
footer .links { display: flex; flex-wrap: wrap; gap: 6px 16px; }

@media (prefers-reduced-motion: no-preference) {
  .jump a, .shop { transition: border-color .15s, color .15s, filter .15s; }
}

/* ---- カテゴリ（キプフェル・まめひなた／ネコチヤン）: 質問ページのいちばん上 ---- */
.catnav { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
.catnav .label { font-size: 0.85rem; color: var(--muted); }
.catnav .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.catnav .tabs a {
  display: flex; flex-direction: column; gap: 2px; min-width: 0; text-decoration: none; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px;
  font-family: var(--font-display); font-weight: 700; line-height: 1.4;
}
.catnav .tabs a small { font-family: var(--font-body); font-weight: 400; font-size: 0.78rem; color: var(--muted); }
.catnav .tabs a:hover { border-color: var(--accent); }
.catnav .tabs a[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.catnav .tabs a[aria-current="page"] small { color: var(--accent-ink); opacity: .85; }
.badge {
  align-self: flex-start; font-size: 0.85rem; font-weight: 700; color: var(--accent);
  background: var(--accent-soft); padding: 2px 12px; border-radius: 999px;
}

/* ---- トップ: カテゴリを選ぶ ---- */
.pick { display: grid; gap: 14px; }
.pick a {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 16px;
  text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 20px; padding: 22px clamp(18px, 4vw, 28px);
}
.pick a:hover { border-color: var(--accent); }
.pick .name { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; line-height: 1.4; }
.pick .desc { grid-column: 1; color: var(--muted); font-size: 0.92rem; }
.pick .go { grid-column: 2; grid-row: 1 / span 2; font-family: var(--font-display); color: var(--accent); font-size: 1.4rem; }
.hint { color: var(--muted); font-size: 0.92rem; }
.nw { display: inline-block; }   /* 言葉の途中で折り返さない（・のあとで折り返す） */
@media (prefers-reduced-motion: no-preference) {
  .catnav .tabs a, .pick a { transition: border-color .15s, background-color .15s; }
}
</style>
</head>

<div class="wrap">

  <header class="hero">
    <h1>ずっと一緒。<span class="sub">よくある質問・お問い合わせ</span></h1>

    <nav class="pick" aria-label="カテゴリ">
      <a href="kipfel-mamehinata.html"><span class="name"><span class="nw">キプフェル・</span><span class="nw">まめひなた</span></span><span class="desc"><span class="nw">キプフェル版・</span><span class="nw">まめひなた版・</span><span class="nw">セット</span><span class="nw">（まめキプ連れ歩きギミック）</span></span><span class="go" aria-hidden="true">→</span></a>
      <a href="nekochiyan.html"><span class="name">ネコチヤン</span><span class="desc"><span class="nw">ネコチヤン版</span><span class="nw">（ネコチヤン連れ歩きギミック）</span></span><span class="go" aria-hidden="true">→</span></a>
    </nav>
    <p class="hint">両方使っているときは、困っているキャラクターの方を選んでください。お問い合わせ方法は、それぞれのページのいちばん下にあります。</p>
  </section>

  <footer>
    <p>製作者：ハオ（好好MART）</p>
    <div class="links">
      <a href="https://hollowhao.booth.pm/" target="_blank" rel="noopener">BOOTH</a>

</div>

</body>
</html>
